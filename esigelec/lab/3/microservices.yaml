# Configuration of the PetClinic services
#
# Outside of Kubernetes, the services get it from a config server, which reads it from a Git
# repository. Here, they read it from this ConfigMap, mounted as the file /config/application.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
data:
  application.yml: |
    server:
      port: 8080
    management:
      tracing:
        sampling:
          probability: 1
        export:
          zipkin:
            endpoint: http://tracing-server/api/v2/spans
    spring:
      # The scripts that create and fill the database of a service
      sql:
        init:
          schema-locations: classpath*:db/hsqldb/schema.sql
          data-locations: classpath*:db/hsqldb/data.sql
      jpa:
        open-in-view: false
        hibernate:
          ddl-auto: none
      cloud:
        # Kubernetes finds the Pods behind the name of a Service, and balances the load between
        # them: no discovery server, and no load balancer in the services.
        discovery:
          enabled: false
        loadbalancer:
          enabled: false
        # The routes of the API Gateway, which the other services ignore. They call each Service
        # by its name, without a port: the Services listen on the port 80, the default port of
        # HTTP.
        gateway:
          server:
            webflux:
              routes:
                - id: vets-service
                  uri: http://vets-service
                  predicates:
                    - Path=/api/vet/**
                  filters:
                    - StripPrefix=2
                - id: visits-service
                  uri: http://visits-service
                  predicates:
                    - Path=/api/visit/**
                  filters:
                    - StripPrefix=2
                - id: customers-service
                  uri: http://customers-service
                  predicates:
                    - Path=/api/customer/**
                  filters:
                    - StripPrefix=2
                - id: genai-service
                  uri: http://genai-service
                  predicates:
                    - Path=/api/genai/**
                  filters:
                    - StripPrefix=2
                    - CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: main
          image: mincongclassroom/spring-petclinic-api-gateway:2026.0-rc6
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            # - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
            #   value: "DEBUG"
            # - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
            #   value: "DEBUG"
            # - name: LOGGING_LEVEL_REACTOR_NETTY
            #   value: "DEBUG"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: petclinic-config
              mountPath: /config
          ports:
            - containerPort: 8080
      volumes:
        - name: petclinic-config
          configMap:
            name: petclinic-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
