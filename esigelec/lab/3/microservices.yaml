# Configuration of the PetClinic services
#
# Outside of Kubernetes, the services get it from a config server, which reads it from a Git
# repository. Here, they read it from this ConfigMap, mounted as the file /config/application.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
data:
  application.yml: |
    server:
      port: 8080
      # The access log of a service: one line for each HTTP request that it receives, in the
      # logs of its container, which starts with "AccessLog" as the one of the API Gateway. The
      # API Gateway has another web server: see its Deployment.
      tomcat:
        accesslog:
          enabled: true
          directory: /dev
          prefix: stdout
          suffix: ""
          file-date-format: ""
          buffered: false
          pattern: "AccessLog: %h %l %u %t \"%r\" %s %b %{ms}T"
    management:
      # What a service tells about itself under the path /actuator, such as its health and
      # its metrics: everything
      endpoints:
        web:
          exposure:
            include: "*"
      # The traces of the requests, sent to the Tracing Server. Disabled as long as no Tracing
      # Server runs: otherwise, each service logs an error when it fails to send them.
      tracing:
        sampling:
          probability: 1
        export:
          enabled: false
          zipkin:
            endpoint: http://tracing-server/api/v2/spans
    spring:
      # The scripts that create and fill the database of a service
      sql:
        init:
          schema-locations: classpath*:db/hsqldb/schema.sql
          data-locations: classpath*:db/hsqldb/data.sql
      jpa:
        open-in-view: false
        hibernate:
          ddl-auto: none
      cloud:
        # Kubernetes finds the Pods behind the name of a Service, and balances the load between
        # them: no discovery server, and no load balancer in the services.
        discovery:
          enabled: false
          # The GenAI service, which Lab 5 adds, looks up the Customers Service with the discovery
          # client of Spring Cloud: without a discovery server, its address is written here. It
          # is the only lookup of the stack: the other calls go to the name of a Service.
          client:
            simple:
              instances:
                customers-service:
                  - uri: http://customers-service
        loadbalancer:
          enabled: false
        # The routes of the API Gateway, which the other services ignore. They call each Service
        # by its name, without a port: the Services listen on the port 80, the default port of
        # HTTP.
        gateway:
          server:
            webflux:
              routes:
                - id: vets-service
                  uri: http://vets-service
                  predicates:
                    - Path=/api/vet/**
                  filters:
                    - StripPrefix=2
                - id: visits-service
                  uri: http://visits-service
                  predicates:
                    - Path=/api/visit/**
                  filters:
                    - StripPrefix=2
                - id: customers-service
                  uri: http://customers-service
                  predicates:
                    - Path=/api/customer/**
                  filters:
                    - StripPrefix=2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: main
          image: mincongclassroom/spring-petclinic-api-gateway:2026.0
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            # The access log of the gateway: an option of its web server, Netty
            - name: JAVA_TOOL_OPTIONS
              value: -Dreactor.netty.http.server.accessLogEnabled=true
            # - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
            #   value: "DEBUG"
            # - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
            #   value: "DEBUG"
            # - name: LOGGING_LEVEL_REACTOR_NETTY
            #   value: "DEBUG"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: petclinic-config
              mountPath: /config
          ports:
            - containerPort: 8080
      volumes:
        - name: petclinic-config
          configMap:
            name: petclinic-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      containers:
        - name: main
          image: mincongclassroom/spring-petclinic-customers-service:2026.0
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: petclinic-config
              mountPath: /config
      volumes:
        - name: petclinic-config
          configMap:
            name: petclinic-config
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
spec:
  type: ClusterIP
  selector:
    app: customers-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
