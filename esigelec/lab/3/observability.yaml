# Observability of the PetClinic services: the Tracing Server, Prometheus, Grafana and the Metrics
# Server
#
# The Tracing Server (Zipkin) collects the traces of the requests, once the services send them:
# see "tracing" in the ConfigMap "petclinic-config". Prometheus collects the metrics of each Pod of
# the four PetClinic services, every 15 seconds, and Grafana draws them. The Metrics Server measures the
# CPU and the memory of the Pods, for "kubectl top". Apply it next to the stack of
# microservices.yaml, in the same namespace; the Metrics Server goes to the namespace
# "kube-system" in any case. Apply it without the option "--namespace" ("-n"): with it, kubectl
# refuses the resources that name another namespace, those of the Metrics Server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracing-server
spec:
  selector:
    matchLabels:
      app: tracing-server
  template:
    metadata:
      labels:
        app: tracing-server
    spec:
      containers:
        - name: main
          image: openzipkin/zipkin
          env:
            # The number of spans that Zipkin keeps in memory: the oldest traces are removed
            # beyond it. The default, 500000, does not fit in its memory under a heavy load.
            - name: MEM_MAX_SPANS
              value: "50000"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: tracing-server
spec:
  type: ClusterIP
  selector:
    app: tracing-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9411
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: petclinic
        # The Pods to monitor: Prometheus asks Kubernetes for the Pods of its namespace, and
        # calls each of them, so that it monitors every replica of a service. It reads the
        # metrics of a Pod at this path.
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          # Keep the Pods of the four PetClinic services, by their label "app"
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: api-gateway|customers-service|visits-service|vets-service
            action: keep
          # Name each target by its service and its Pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        # Ask the services not to trace these calls, with the header of Zipkin: otherwise, the
        # Tracing Server fills up with them, 16 a minute.
        http_headers:
          b3:
            values: ["0"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
spec:
  selector:
    matchLabels:
      app: prometheus-server
  template:
    metadata:
      labels:
        app: prometheus-server
    spec:
      # The identity of Prometheus in Kubernetes, allowed to list the Pods: see below
      serviceAccountName: prometheus-server
      containers:
        - name: main
          image: prom/prometheus:v3.1.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
spec:
  type: ClusterIP
  selector:
    app: prometheus-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9090
---
# Allow Prometheus to list the Pods of its namespace, to find the ones to monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-server
subjects:
  - kind: ServiceAccount
    name: prometheus-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  # Where Grafana reads the metrics: Prometheus, by the name of its Service
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server
        isDefault: true
